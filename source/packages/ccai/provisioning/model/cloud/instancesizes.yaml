# instancesizes.yaml — neutral instance-size token -> per-venue SKU catalog.
#
# This catalog covers CPU/RAM instance shapes only.  GPU/accelerator
# sizing lives in accelerators.yaml and must not be duplicated here.
#
# Token scheme: <family>.<size>
#   families: general | compute (CPU-optimised) | memory (RAM-optimised)
#   sizes:    small | medium | large | xlarge | 2xlarge
#
# Each entry binds one neutral token to:
#   - vcpu: neutral vCPU count for the shape
#   - memory_gb: neutral RAM in GB for the shape
#   - venue_skus: mapping of provisioning-venue-name to native SKU string.
#
# Not every token needs every venue; a token simply omits venues where
# no good native match exists.
#
# Loader invariants enforced at load time:
#   - Each token is unique.
#   - Within any single venue, no two tokens map to the same SKU.

version: 1
entries:

  # ---- general purpose -------------------------------------------------
  - token: general.small
    vcpu: 2
    memory_gb: 4
    venue_skus:
      aws: t3.medium
      azure: Standard_B2s
      gcp: e2-small
      oracle: VM.Standard.E4.Flex.1
      digitalocean: s-2vcpu-4gb
      hetzner: cx22
      linode: g6-standard-2
      equinix_metal: t3.small.x86
      vultr: vc2-2c-4gb
      crusoe: c1a.2x
      nebius: cpu-c2-m4
      lambdalabs: cpu_2x_general

  - token: general.medium
