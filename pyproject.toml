[project]
name = "codecraftai-provisioning"
version = "1.1.0"
description = "Code Craft AI - Provisioning Package"
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
authors = [{name = "Myron Walker", email = "myron.walker@gmail.com"}]
keywords = [
    "python",
    "automation",
    "ccai",
    "provisioning",
    "cloud"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "pyyaml>=6.0.2,<7.0.0",
    "requests>=2.32.5,<3.0.0",
    "codecraftai-foundations<2.0.0",
    "codecraftai-credentials<2.0.0",
    "codecraftai-restclient-base<2.0.0",
    "codecraftai-configuration<2.0.0",
    "codecraftai-landscaping<2.0.0",
    "codecraftai-testbase<2.0.0",
    "codecraftai-restclient-vsphere<2.0.0",
    "codecraftai-restclient-coreweave<2.0.0",
    "codecraftai-restclient-lambdalabs<2.0.0",
    "codecraftai-restclient-crusoe<2.0.0",
    "codecraftai-restclient-nebius<2.0.0",
    "codecraftai-restclient-runpod<2.0.0",
    "codecraftai-restclient-oracle<2.0.0",
    "codecraftai-restclient-proxmox<2.0.0",
    "codecraftai-restclient-aws<2.0.0",
    "codecraftai-restclient-azure<2.0.0",
    "codecraftai-restclient-digitalocean<2.0.0",
    "codecraftai-restclient-google<2.0.0",
    "codecraftai-restclient-hetzner<2.0.0",
    "codecraftai-restclient-linode<2.0.0",
    "codecraftai-restclient-nutanix<2.0.0",
]
# Hypervisor interop bindings are execution-time backends only. They pull
# heavyweight, platform-specific native deps (e.g. ``interop-libvirt`` ->
# ``libvirt-python`` needs pkg-config + libvirt headers; ``interop-kubernetes``
# -> the full kubernetes client). The ``ccai.provisioning.model.*`` types that
# downstream packages (``codecraftai-configuration`` and beyond) import are
# self-contained and never import these, so they are kept in an optional group
# to avoid dragging native toolchains into pure-model consumers. Install with
# ``poetry install --with hypervisors`` when a hypervisor venue is needed.

[dependency-groups]
hypervisors = [
    "codecraftai-interop-kubernetes<2.0.0",
    "codecraftai-interop-libvirt<2.0.0",
    "codecraftai-interop-xen<2.0.0",
    "codecraftai-interop-hyperv<2.0.0",
]
cloud-sdks = []
dev = [
    "codecraftai-testbase<2.0.0",
    "requests-mock>=1.12,<2.0.0",
]
dbio = []

[tool.poetry]
packages = [{include="ccai", from="source/packages"}]
include = [
    { path = "source/packages/ccai/provisioning/model/cloud/accelerators.yaml", format = ["sdist", "wheel"] }
]

[tool.poetry.dependencies]
codecraftai-foundations = {source = "codecraftai"}
codecraftai-credentials = {source = "codecraftai"}
codecraftai-restclient-base = {source = "codecraftai"}
codecraftai-configuration = {source = "codecraftai"}
codecraftai-landscaping = {source = "codecraftai"}
codecraftai-testbase = {source = "codecraftai"}
codecraftai-restclient-vsphere = {source = "codecraftai"}
codecraftai-restclient-coreweave = {source = "codecraftai"}
codecraftai-restclient-lambdalabs = {source = "codecraftai"}
codecraftai-restclient-crusoe = {source = "codecraftai"}
codecraftai-restclient-nebius = {source = "codecraftai"}
codecraftai-restclient-runpod = {source = "codecraftai"}
codecraftai-restclient-oracle = {source = "codecraftai"}
codecraftai-restclient-proxmox = {source = "codecraftai"}
codecraftai-restclient-aws = {source = "codecraftai"}
codecraftai-restclient-azure = {source = "codecraftai"}
codecraftai-restclient-digitalocean = {source = "codecraftai"}
codecraftai-restclient-google = {source = "codecraftai"}
codecraftai-restclient-hetzner = {source = "codecraftai"}
codecraftai-restclient-linode = {source = "codecraftai"}
codecraftai-restclient-nutanix = {source = "codecraftai"}

[tool.poetry.group.hypervisors]
optional = true

[tool.poetry.group.hypervisors.dependencies]
codecraftai-interop-kubernetes = {source = "codecraftai"}
codecraftai-interop-libvirt = {source = "codecraftai"}
codecraftai-interop-xen = {source = "codecraftai"}
codecraftai-interop-hyperv = {source = "codecraftai"}

[tool.poetry.group.cloud-sdks]
optional = true

[tool.poetry.group.dev.dependencies]
codecraftai-testbase = {source = "codecraftai"}

[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[[tool.uv.index]]
# Same licensed index as [[tool.poetry.source]]. Listed before PyPI so that
# codecraftai-* packages (direct and transitive) resolve from it; everything
# else falls through to PyPI. Credentials: UV_INDEX_CODECRAFTAI_USERNAME /
# UV_INDEX_CODECRAFTAI_PASSWORD, or `uv auth login`.
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"

[tool.ruff.lint]
# Deliberately narrow.  This gate exists for one reason: a bare `except:`
# swallows ConfigurationError and SemanticError, which derive from
# BaseException precisely so that they pass through ordinary handlers and end
# the run.  Catching them hides the original cause behind whatever error
# happens next.  See userguide/10-00-coding-standards.rst, exception-handling
# rules 5-7.  Use `except Exception:` when you mean "any ordinary failure".
select = ["E722"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
