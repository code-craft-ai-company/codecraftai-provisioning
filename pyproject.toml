[tool.poetry]
name = "codecraftai-provisioning"
description = "Code Craft AI - Provisioning Package"
version = "0.0.1"
authors = [
    "Myron Walker <myron.walker@gmail.com>"
]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python",
    "automation",
    "ccai",
    "provisioning",
    "cloud"
]
packages = [{include="ccai", from="source/packages"}]
include = [
    { path = "source/packages/ccai/provisioning/model/cloud/accelerators.yaml", format = ["sdist", "wheel"] }
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyyaml = "^6.0.2"
requests = "^2.32.5"
codecraftai-errors = { git = "https://github.com/automationmojo/codecraftai-errors.git", branch = "main" }
codecraftai-interfaces = { git = "https://github.com/automationmojo/codecraftai-interfaces.git", branch = "main" }
codecraftai-credentials = { git = "https://github.com/automationmojo/codecraftai-credentials.git", branch = "main" }
codecraftai-restclient-base = { git = "https://github.com/automationmojo/codecraftai-restclient-base.git", branch = "main" }
codecraftai-configuration = { git = "https://github.com/automationmojo/codecraftai-configuration.git", branch = "main" }
codecraftai-landscaping = { git = "https://github.com/automationmojo/codecraftai-landscaping.git", branch = "main" }
codecraftai-restclient-vsphere = { git = "https://github.com/automationmojo/codecraftai-restclient-vsphere.git", branch = "main" }
codecraftai-restclient-coreweave = { git = "https://github.com/automationmojo/codecraftai-restclient-coreweave.git", branch = "main" }
codecraftai-restclient-lambdalabs = { git = "https://github.com/automationmojo/codecraftai-restclient-lambdalabs.git", branch = "main" }
codecraftai-restclient-crusoe = { git = "https://github.com/automationmojo/codecraftai-restclient-crusoe.git", branch = "main" }
codecraftai-restclient-nebius = { git = "https://github.com/automationmojo/codecraftai-restclient-nebius.git", branch = "main" }
codecraftai-restclient-runpod = { git = "https://github.com/automationmojo/codecraftai-restclient-runpod.git", branch = "main" }
codecraftai-restclient-oracle = { git = "https://github.com/automationmojo/codecraftai-restclient-oracle.git", branch = "main" }
codecraftai-restclient-proxmox = { git = "https://github.com/automationmojo/codecraftai-restclient-proxmox.git", branch = "main" }
codecraftai-restclient-azure = { git = "https://github.com/automationmojo/codecraftai-restclient-azure.git", branch = "main" }
codecraftai-restclient-digitalocean = { git = "https://github.com/automationmojo/codecraftai-restclient-digitalocean.git", branch = "main" }
codecraftai-restclient-google = { git = "https://github.com/automationmojo/codecraftai-restclient-google.git", branch = "main" }
codecraftai-restclient-hetzner = { git = "https://github.com/automationmojo/codecraftai-restclient-hetzner.git", branch = "main" }
codecraftai-restclient-linode = { git = "https://github.com/automationmojo/codecraftai-restclient-linode.git", branch = "main" }
codecraftai-restclient-nutanix = { git = "https://github.com/automationmojo/codecraftai-restclient-nutanix.git", branch = "main" }

# Hypervisor interop bindings are execution-time backends only. They pull
# heavyweight, platform-specific native deps (e.g. ``interop-libvirt`` ->
# ``libvirt-python`` needs pkg-config + libvirt headers; ``interop-kubernetes``
# -> the full kubernetes client). The ``ccai.provisioning.model.*`` types that
# downstream packages (``codecraftai-configuration`` and beyond) import are
# self-contained and never import these, so they are kept in an optional group
# to avoid dragging native toolchains into pure-model consumers. Install with
# ``poetry install --with hypervisors`` when a hypervisor venue is needed.
[tool.poetry.group.hypervisors]
optional = true

[tool.poetry.group.hypervisors.dependencies]
codecraftai-interop-kubernetes = { git = "https://github.com/automationmojo/codecraftai-interop-kubernetes.git", branch = "main" }
codecraftai-interop-libvirt = { git = "https://github.com/automationmojo/codecraftai-interop-libvirt.git", branch = "main" }
codecraftai-interop-xen = { git = "https://github.com/automationmojo/codecraftai-interop-xen.git", branch = "main" }
codecraftai-interop-hyperv = { git = "https://github.com/automationmojo/codecraftai-interop-hyperv.git", branch = "main" }

[tool.poetry.group.cloud-sdks]
optional = true

[tool.poetry.group.cloud-sdks.dependencies]
boto3 = "^1.34"

[tool.poetry.group.dev.dependencies]
hypothesis = "^6.0"
pytest = ">=8,<10"
requests-mock = "^1.12"
moto = "^5.0"

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
