[tool.poetry]
name = "codecraftai-provisioning"
description = "Code Craft AI - Provisioning Package"
version = "1.0.1"
authors = [
    "Myron Walker <myron.walker@gmail.com>"
]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python",
    "automation",
    "ccai",
    "provisioning",
    "cloud"
]
packages = [{include="ccai", from="source/packages"}]
include = [
    { path = "source/packages/ccai/provisioning/model/cloud/accelerators.yaml", format = ["sdist", "wheel"] }
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyyaml = "^6.0.2"
requests = "^2.32.5"
codecraftai-foundations = { version = "<2.0.0", source = "codecraftai" }
codecraftai-credentials = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-base = { version = "<2.0.0", source = "codecraftai" }
codecraftai-configuration = { version = "<2.0.0", source = "codecraftai" }
codecraftai-landscaping = { version = "<2.0.0", source = "codecraftai" }
codecraftai-testbase = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-vsphere = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-coreweave = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-lambdalabs = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-crusoe = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-nebius = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-runpod = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-oracle = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-proxmox = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-aws = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-azure = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-digitalocean = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-google = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-hetzner = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-linode = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-nutanix = { version = "<2.0.0", source = "codecraftai" }

# Hypervisor interop bindings are execution-time backends only. They pull
# heavyweight, platform-specific native deps (e.g. ``interop-libvirt`` ->
# ``libvirt-python`` needs pkg-config + libvirt headers; ``interop-kubernetes``
# -> the full kubernetes client). The ``ccai.provisioning.model.*`` types that
# downstream packages (``codecraftai-configuration`` and beyond) import are
# self-contained and never import these, so they are kept in an optional group
# to avoid dragging native toolchains into pure-model consumers. Install with
# ``poetry install --with hypervisors`` when a hypervisor venue is needed.
[tool.poetry.group.hypervisors]
optional = true

[tool.poetry.group.hypervisors.dependencies]
codecraftai-interop-kubernetes = { version = "<2.0.0", source = "codecraftai" }
codecraftai-interop-libvirt = { version = "<2.0.0", source = "codecraftai" }
codecraftai-interop-xen = { version = "<2.0.0", source = "codecraftai" }
codecraftai-interop-hyperv = { version = "<2.0.0", source = "codecraftai" }

[tool.poetry.group.cloud-sdks]
optional = true

[tool.poetry.group.cloud-sdks.dependencies]

[tool.poetry.group.dev.dependencies]
codecraftai-testbase = { version = "<2.0.0", source = "codecraftai" }
pytest = ">=8,<10"
requests-mock = "^1.12"

[tool.poetry.group.dbio.dependencies]


[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[tool.ruff.lint]
# Deliberately narrow.  This gate exists for one reason: a bare `except:`
# swallows ConfigurationError and SemanticError, which derive from
# BaseException precisely so that they pass through ordinary handlers and end
# the run.  Catching them hides the original cause behind whatever error
# happens next.  See userguide/10-00-coding-standards.rst, exception-handling
# rules 5-7.  Use `except Exception:` when you mean "any ordinary failure".
select = ["E722"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
