[project]
name = "codecraftai-provisioning"
version = "1.3.0"
description = "Code Craft AI - Provisioning Package"
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Source-Available"
authors = [{name = "Myron Walker", email = "myron.walker@gmail.com"}]
keywords = [
    "python",
    "automation",
    "ccai",
    "provisioning",
    "cloud"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "pyyaml>=6.0.2,<7.0.0",
    "requests>=2.32.5,<3.0.0",
    "codecraftai-foundations>=1.0.0,<2.0.0",
    "codecraftai-credentials>=1.0.0,<2.0.0",
    "codecraftai-restclient-base>=1.0.0,<2.0.0",
    "codecraftai-configuration>=1.0.0,<2.0.0",
    "codecraftai-landscaping>=1.0.0,<2.0.0",
    "codecraftai-testbase>=1.0.0,<2.0.0",
    "codecraftai-restclient-vsphere>=1.0.0,<2.0.0",
    "codecraftai-restclient-coreweave>=1.0.0,<2.0.0",
    "codecraftai-restclient-lambdalabs>=1.0.0,<2.0.0",
    "codecraftai-restclient-crusoe>=1.0.0,<2.0.0",
    "codecraftai-restclient-nebius>=1.0.0,<2.0.0",
    "codecraftai-restclient-runpod>=1.0.0,<2.0.0",
    "codecraftai-restclient-oracle>=1.0.0,<2.0.0",
    "codecraftai-restclient-proxmox>=1.0.0,<2.0.0",
    "codecraftai-restclient-aws>=1.0.0,<2.0.0",
    "codecraftai-restclient-azure>=1.0.0,<2.0.0",
    "codecraftai-restclient-digitalocean>=1.0.0,<2.0.0",
    "codecraftai-restclient-google>=1.0.0,<2.0.0",
    "codecraftai-restclient-hetzner>=1.0.0,<2.0.0",
    "codecraftai-restclient-linode>=1.0.0,<2.0.0",
    "codecraftai-restclient-nutanix>=1.0.0,<2.0.0",
]
# Hypervisor interop bindings are execution-time backends only. They pull
# heavyweight, platform-specific native deps (e.g. ``interop-libvirt`` ->
# ``libvirt-python`` needs pkg-config + libvirt headers; ``interop-kubernetes``
# -> the full kubernetes client). The ``ccai.provisioning.model.*`` types that
# downstream packages (``codecraftai-configuration`` and beyond) import are
# self-contained and never import these, so they are kept in an optional group
# to avoid dragging native toolchains into pure-model consumers. Install with
# ``poetry install --with hypervisors`` when a hypervisor venue is needed.

[project.urls]
Repository = "https://github.com/code-craft-ai-company/codecraftai-provisioning"
Issues = "https://github.com/code-craft-ai-company/codecraftai-provisioning/issues"

[dependency-groups]
hypervisors = [
    "codecraftai-interop-kubernetes>=1.0.0,<2.0.0",
    "codecraftai-interop-libvirt>=1.0.0,<2.0.0",
    "codecraftai-interop-xen>=1.0.0,<2.0.0",
    "codecraftai-interop-hyperv>=1.0.0,<2.0.0",
]
cloud-sdks = []
dev = [
    "codecraftai-testbase>=1.0.0,<2.0.0",
    "requests-mock>=1.12,<2.0.0",
]
dbio = []

[tool.poetry]
packages = [{include="ccai", from="source/packages"}]
include = [
    { path = "source/packages/ccai/provisioning/model/cloud/accelerators.yaml", format = ["sdist", "wheel"] }
]

[tool.poetry.group.hypervisors]
optional = true

[tool.poetry.group.cloud-sdks]
optional = true

[tool.ruff.lint]
# Deliberately narrow.  This gate exists for one reason: a bare `except:`
# swallows ConfigurationError and SemanticError, which derive from
# BaseException precisely so that they pass through ordinary handlers and end
# the run.  Catching them hides the original cause behind whatever error
# happens next.  See userguide/10-00-coding-standards.rst, exception-handling
# rules 5-7.  Use `except Exception:` when you mean "any ordinary failure".
select = ["E722"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
